name: Deploy to VPS

on:
  push:
    branches: [ "dev" ]   # ← change if you deploy another branch
  workflow_dispatch:        # allow manual runs from Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KEY_B64 }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          head -n1 ~/.ssh/id_ed25519 | grep -q "BEGIN OPENSSH PRIVATE KEY" || (echo "Bad key header" && exit 1)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1 || (echo "Invalid SSH key material" && exit 1)
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts



      - name: Sync repo to VPS (rsync)
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude "node_modules" \
            --exclude ".github" \
            -e "ssh -p ${{ secrets.VPS_PORT }}" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/"

      - name: Remote deploy commands (build + migrate + reload)
        env:
          BRANCH: ${{ secrets.BRANCH || 'dev' }}
        run: |
          ssh -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -lc '
            set -e
            cd "${VPS_PATH:-'${{ secrets.VPS_PATH }}'}"

            echo ">>> Ensure correct branch"
            if git rev-parse --git-dir > /dev/null 2>&1; then
              git fetch origin "$BRANCH" || true
              git checkout "$BRANCH" || true
            fi

            echo ">>> Backend deps + Prisma"
            cd backend
            if [ ! -f .env ]; then
              echo "ERROR: backend/.env is missing on the server. Create it before deploying."
              exit 1
            fi
            npm ci
            npx prisma generate
            npx prisma migrate deploy || true

            echo ">>> Start/Reload API"
            if pm2 describe my-backend > /dev/null; then
              pm2 reload my-backend
            else
              pm2 start npm --name "my-backend" -- run start
            fi
            pm2 save

            echo ">>> Frontend build"
            cd ../frontend
            npm ci
            npm run build || npm run build:prod || true

            echo ">>> Done on server"
          '
